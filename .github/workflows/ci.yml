name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The smoke tests boot the API in-process and need a real SQL Server (Delta reads @@DBTS).
      # The SA password is generated fresh for every run and never written to the repo or the log.
      - name: Start SQL Server
        run: |
          set -euo pipefail
          SA_PASSWORD="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9')Aa1!"
          echo "::add-mask::$SA_PASSWORD"

          docker run -d --name sqlserver \
            -e ACCEPT_EULA=Y \
            -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest

          for i in $(seq 1 30); do
            if docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is ready after $((i * 2))s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "SQL Server did not become ready in time" >&2
              docker logs sqlserver >&2
              exit 1
            fi
            sleep 2
          done

          echo "HYPERCACHE_TEST_CONNECTION=Server=localhost,1433;Database=HyperCacheDB_Test;User ID=sa;Password=$SA_PASSWORD;TrustServerCertificate=True;MultipleActiveResultSets=true" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore HyperCache.slnx

      - name: Build
        run: dotnet build HyperCache.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test HyperCache.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
